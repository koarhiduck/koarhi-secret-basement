<h1>二重スリット実験</h1>
<p class="lead">粒子は1個ずつ飛び、スクリーンに点が落ちます。数が増えると縞が現れます。「観測」をONにすると、経路が分かって縞が消えます。解説は<a href="../articles/double-slit.html">こちら</a>。</p>
<canvas id="c" width="720" height="420" aria-label="二重スリット実験のシミュレーション"></canvas>
<div class="row">
  <button id="obs" class="off">観測: OFF</button>
  <button id="reset">リセット</button>
  <label>スリット間隔 <input id="d" type="range" min="2" max="10" step="0.1" value="5"></label>
  <label>波長 <input id="w" type="range" min="0.5" max="2" step="0.05" value="1"></label>
  <label>速度 <input id="r" type="range" min="1" max="60" value="8"></label>
  <span>粒子数: <b id="count">0</b></span>
</div>
